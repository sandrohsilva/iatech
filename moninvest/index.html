<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MonInvest — Análise de Investimentos</title>

  <meta name="description"
    content="MonInvest: A ferramenta que ajuda analisar Ações, BDRs, FIIs, ETFs e acompanhar seus investimentos com privacidade e inteligência.">
  <meta name="theme-color" content="#ffffff">

  <!-- Open Graph -->
  <meta property="og:title" content="MonInvest — Análise de Investimentos">
  <meta property="og:description"
    content="A ferramenta que ajuda analisar Ações, BDRs, FIIs, ETFs e acompanhar seus investimentos. Baixe direto na Google Play Store.">
  <meta property="og:image" content="monInvest.webp">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/webp" href="monInvest.webp">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px 20px;
    }

    /* Container de conteúdo */
    .container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    /* Topo: Logo + Títulos */
    .header-brand {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      object-fit: contain;
      box-shadow: 0 4px 14px rgba(10, 37, 88, 0.12);
      flex-shrink: 0;
      background: #ffffff;
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
    }

    .app-name {
      font-size: 1.65rem;
      font-weight: 800;
      color: #0b2559;
      /* Azul Escuro */
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .app-subtitle {
      font-size: 0.95rem;
      font-weight: 600;
      color: #3b82f6;
      margin-top: 2px;
    }

    /* Linha descritiva */
    .app-description {
      font-size: 1rem;
      line-height: 1.5;
      color: #475569;
      margin-bottom: 36px;
      font-weight: 450;
      border-left: 3px solid #0b2559;
      padding-left: 12px;
    }

    /* Área central de CTAs */
    .cta-section {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 700;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Botão Principal: Baixar o App */
    .btn-download {
      background: linear-gradient(135deg, #0b2559, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(11, 37, 89, 0.28);
    }

    .btn-download svg {
      fill: currentColor;
    }

    /* Botão Secundário: Abrir o App */
    .btn-open {
      background-color: #f1f5f9;
      color: #0b2559;
      border: 1.5px solid #cbd5e1;
    }

    .btn-open:active {
      background-color: #e2e8f0;
    }

    /* Frase de Segurança Google Play */
    .security-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      font-size: 0.82rem;
      color: #15803d;
      /* Verde seguro */
      font-weight: 600;
      text-align: center;
      background: #f0fdf4;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #bbf7d0;
    }

    .security-notice svg {
      flex-shrink: 0;
    }

    /* Rodapé discreto */
    .footer {
      text-align: center;
      padding-top: 24px;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .footer a {
      color: #64748b;
      text-decoration: underline;
    }
  </style>

<body>

  <div class="container">
    <!-- Topo: Logo + Títulos -->
    <header class="header-brand">
      <img src="monInvest.webp" alt="Logo MonInvest" class="brand-logo">
      <div class="brand-titles">
        <h1 class="app-name">MonInvest</h1>
        <span class="app-subtitle">Análise de investimentos</span>
      </div>
    </header>

    <!-- Linha Descritiva -->
    <p class="app-description">
      A ferramenta que ajuda analisar Ações, BDRs, FIIs, ETFs e acompanhar seus investimentos
    </p>

    <!-- Ações Centrais -->
    <main class="cta-section">
      <!-- Baixar o App -->
      <a href="https://play.google.com/store/apps/details?id=br.com.iatech.moninvest" class="btn btn-download">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path
            d="M3.609 1.814L13.793 12 3.61 22.186a2.38 2.38 0 0 1-.61-.914c-.16-.44-.24-.916-.24-1.417V4.145c0-.5.08-.977.24-1.417.153-.42.36-.734.61-.914zM15.207 13.414l2.42 2.42-12.016 6.94 9.596-9.36zm0-2.828L5.61 1.226 17.627 8.166l-2.42 2.42zm1.414 1.414l2.87-2.87c.725-.42 1.258-.236 1.488.084.18.25.26.59.26.986s-.08.736-.26.986c-.23.32-.763.504-1.488.084l-2.87-2.87z" />
        </svg>
        <span>Baixar o App</span>
      </a>

      <!-- Abrir o App -->
      <a href="https://play.google.com/store/apps/details?id=br.com.iatech.moninvest" class="btn btn-open">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        <span>Abrir o App</span>
      </a>

      <!-- Frase de Segurança Google Play -->
      <div class="security-notice">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
        <span>Aplicativo verificado e 100% seguro na Google Play Store</span>
      </div>
    </main>

    <!-- Rodapé -->
    <footer class="footer">
      <p>&copy; iA Tech &bull; <a href="privacy.html">Política de Privacidade</a></p>
    </footer>
  </div>
